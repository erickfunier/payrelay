name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server
