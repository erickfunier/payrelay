services:
  payrelay:
    build: .
    ports:
      - "8080:8080"
    environment:
      PAYRELAY_ADDR: ":8080"
      PAYRELAY_DB_PATH: /data/payrelay.db
      PAYRELAY_WORKER_POLL: 500ms
      PAYRELAY_MAX_ATTEMPTS: "5"
      PAYRELAY_API_KEYS: ${PAYRELAY_API_KEYS:?Set PAYRELAY_API_KEYS to tenant:api-key pairs before starting Docker Compose}
    volumes:
      - payrelay-data:/data

volumes:
  payrelay-data:
